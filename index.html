<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10141b">
    <title>Seed of Yggdrasil — Character Generator</title>
    <meta name="description" content="Draw a random hero from the roots of the World Tree. A procedural Norse-inspired RPG character generator.">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B3%3C/text%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="roots" aria-hidden="true">
        <svg viewBox="0 0 1200 1000" preserveAspectRatio="xMidYMid slice" xmlns:xlink="http://www.w3.org/1999/xlink">
            <defs>
                <filter id="glowAmber" x="-100%" y="-100%" width="300%" height="300%">
                    <feGaussianBlur stdDeviation="3.2" result="blur"/>
                    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
                <filter id="glowBlue" x="-100%" y="-100%" width="300%" height="300%">
                    <feGaussianBlur stdDeviation="3.2" result="blur"/>
                    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>

                <g id="cluster">
                    <path d="M0,0 C0,-30 -10,-50 -40,-65 C-70,-80 -90,-75 -95,-55 C-100,-38 -82,-30 -76,-42 C-72,-50 -80,-54 -84,-48"/>
                    <path d="M0,0 C0,-30 10,-50 40,-65 C70,-80 90,-75 95,-55 C100,-38 82,-30 76,-42 C72,-50 80,-54 84,-48"/>
                    <path d="M-30,-45 C-45,-60 -65,-65 -78,-55 C-90,-46 -86,-32 -76,-34 C-69,-36 -71,-44 -78,-42"/>
                    <path d="M-60,-68 C-65,-90 -82,-102 -100,-98 C-115,-94 -116,-80 -105,-78 C-97,-77 -96,-86 -103,-86"/>
                    <path d="M30,-45 C45,-60 65,-65 78,-55 C90,-46 86,-32 76,-34 C69,-36 71,-44 78,-42"/>
                    <path d="M60,-68 C65,-90 82,-102 100,-98 C115,-94 116,-80 105,-78 C97,-77 96,-86 103,-86"/>
                    <path d="M0,0 C0,-40 -2,-80 0,-110 C1,-125 15,-132 18,-120 C21,-110 10,-105 6,-113"/>
                </g>

                <g id="wolf">
                    <path d="M40,180 C60,140 90,120 130,115 C160,112 180,100 200,80"/>
                    <path d="M55,190 C80,165 105,150 135,140 C165,130 185,110 205,90"/>
                    <path d="M200,80 C210,70 222,65 230,58 L245,50 L235,68"/>
                    <path d="M222,62 C224,52 220,44 214,40"/>
                    <path d="M100,130 C95,150 88,168 78,185"/>
                    <path d="M125,120 C122,142 116,162 106,180"/>
                    <path d="M60,175 C50,185 42,192 32,198"/>
                    <path d="M70,165 C58,178 48,188 36,196"/>
                    <path d="M42,178 C25,175 8,165 2,150 C-2,140 6,132 14,138 C20,143 16,150 10,148"/>
                    <path d="M42,178 C22,185 4,182 -6,170 C-12,163 -6,155 2,158 C8,160 6,166 0,165"/>
                    <path d="M90,122 C85,108 88,94 100,86 C106,82 112,86 109,92 C107,96 101,94 103,89"/>
                    <path d="M130,113 C128,98 134,86 146,80 C152,77 158,82 154,88 C151,92 146,89 148,84"/>
                </g>
            </defs>

            <g fill="none" stroke="#333b4b" stroke-width="2" opacity="0.9">
                <use xlink:href="#cluster" transform="translate(600,850) scale(1.5,-1.5)"/>
                <use xlink:href="#cluster" transform="translate(600,850) scale(0.85,-0.9) rotate(8)"/>
            </g>

            <path stroke="#333b4b" stroke-width="4" fill="none" stroke-linecap="round"
                  d="M600 850 C 595 700, 605 560, 598 420 C 592 320, 604 240, 600 120"/>

            <g fill="none" stroke="#333b4b" stroke-width="2" opacity="0.9">
                <use xlink:href="#cluster" transform="translate(600,120) scale(1.3,1.3)"/>
                <use xlink:href="#cluster" transform="translate(600,120) scale(0.75,0.78) rotate(-6)"/>
                <use xlink:href="#cluster" transform="translate(600,120) scale(0.5,0.53) rotate(10) translate(20,10)"/>
            </g>

            <g transform="translate(190,55)" fill="none" stroke="#333b4b" stroke-width="1.8">
                <circle r="30"/>
                <path d="M0 -44 L0 -58 M0 44 L0 58 M-44 0 L-58 0 M44 0 L58 0
                         M-31 -31 L-40 -40 M31 -31 L40 -40 M-31 31 L-40 40 M31 31 L40 40"/>
            </g>

            <g transform="translate(1010,55)" fill="none" stroke="#333b4b" stroke-width="1.8">
                <path d="M18 -32 A 32 32 0 1 0 18 32 A 24 24 0 1 1 18 -32 Z"/>
            </g>

            <g stroke="#e8964a" stroke-width="2.4" stroke-linecap="round" filter="url(#glowAmber)" opacity="0.85">
                <use xlink:href="#wolf" transform="translate(300,110) scale(-0.62,0.62) rotate(18)"/>
            </g>

            <g stroke="#5fb3d9" stroke-width="2.4" stroke-linecap="round" filter="url(#glowBlue)" opacity="0.85">
                <use xlink:href="#wolf" transform="translate(900,110) scale(0.62,0.62) rotate(-18)"/>
            </g>
        </svg>
    </div>

    <main class="page">
        <header class="hero">
            <h1>Seed of Yggdrasil</h1>
            <p class="tagline">Draw a hero from the roots of the World Tree.</p>
        </header>

        <section class="card">
            <form class="summon-form" id="summonForm" novalidate>
                <label for="characterName">Name your character</label>
                <input
                    type="text"
                    id="characterName"
                    name="characterName"
                    placeholder="e.g. Ragnar"
                    autocomplete="off">
                <button type="submit" id="generateBtn">Reveal your character</button>
            </form>

            <div class="result" id="result" hidden>

                <div class="result-header">
                    <h2 id="charName"></h2>
                    <p id="charMeta"></p>
                </div>

                <dl class="ledger">
                    <div class="ledger-row">
                        <dt>Weapon</dt>
                        <dd id="charWeapon"></dd>
                    </div>
                    <div class="ledger-row">
                        <dt>Signature skill</dt>
                        <dd id="charSkill"></dd>
                    </div>
                </dl>

                <div class="attributes" id="attributes"></div>

                <div class="saga">
                    <p id="charStory"></p>
                </div>
            </div>
        </section>

        <footer class="credit">
            <p>Crafted by Franco Lescano<br>Source code on <a href="https://github.com/LescanoFranco123" target="_blank" rel="noopener">GitHub</a></p>
        </footer>
    </main>

    <script src="js/data.js"></script>
    <script src="js/generator.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
