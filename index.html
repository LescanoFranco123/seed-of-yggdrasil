<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10141b">
    <title>Seed of Yggdrasil — Character Generator</title>
    <meta name="description" content="Draw a random hero from the roots of the World Tree. A procedural Norse-inspired RPG character generator.">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B3%3C/text%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="roots" aria-hidden="true">
        <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet" xmlns:xlink="http://www.w3.org/1999/xlink">
            <defs>
                <filter id="glowA" x="-100%" y="-100%" width="300%" height="300%">
                    <feGaussianBlur stdDeviation="2.5" result="blur"/>
                    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>

                <g id="cluster">
                    <path d="M0,0 C0,-30 -10,-50 -40,-65 C-70,-80 -90,-75 -95,-55 C-100,-38 -82,-30 -76,-42 C-72,-50 -80,-54 -84,-48"/>
                    <path d="M0,0 C0,-30 10,-50 40,-65 C70,-80 90,-75 95,-55 C100,-38 82,-30 76,-42 C72,-50 80,-54 84,-48"/>
                    <path d="M-30,-45 C-45,-60 -65,-65 -78,-55 C-90,-46 -86,-32 -76,-34 C-69,-36 -71,-44 -78,-42"/>
                    <path d="M-60,-68 C-65,-90 -82,-102 -100,-98 C-115,-94 -116,-80 -105,-78 C-97,-77 -96,-86 -103,-86"/>
                    <path d="M30,-45 C45,-60 65,-65 78,-55 C90,-46 86,-32 76,-34 C69,-36 71,-44 78,-42"/>
                    <path d="M60,-68 C65,-90 82,-102 100,-98 C115,-94 116,-80 105,-78 C97,-77 96,-86 103,-86"/>
                    <path d="M0,0 C0,-40 -2,-80 0,-110 C1,-125 15,-132 18,-120 C21,-110 10,-105 6,-113"/>
                </g>

                <g id="wolf">
                    <path d="M -70,-20 C -50,-27 -30,-27 -10,-26 C 2,-26 8,-27 10,-27 C 14,-33 20,-37 26,-40 L 24,-52 L 36,-40 C 44,-38 52,-34 58,-28 L 70,-26 L 58,-16 C 50,-12 42,-11 34,-12 C 26,-8 18,-4 8,-2 C -8,2 -26,3 -42,4 C -54,5 -62,2 -68,-4 C -74,-10 -74,-15 -70,-20 Z"/>
                    <path d="M -66,-6 C -84,-8 -100,-18 -110,-34 C -98,-26 -84,-18 -70,-14 C -68,-11 -67,-8 -66,-6 Z"/>
                    <path d="M 22,-4 L 36,28 L 28,30 L 10,-2 Z"/>
                    <path d="M 2,-1 L 12,30 L 4,32 L -8,1 Z"/>
                    <path d="M -30,3 L -28,32 L -36,33 L -40,4 Z"/>
                    <path d="M -52,3 L -56,30 L -64,29 L -60,2 Z"/>
                </g>
            </defs>

            <g fill="none" stroke="#333b4b" stroke-width="2" opacity="0.9">
                <use xlink:href="#cluster" transform="translate(800,740) scale(1.9,-1.9)"/>
                <use xlink:href="#cluster" transform="translate(800,740) scale(1.15,-1.2) rotate(10)"/>
                <use xlink:href="#cluster" transform="translate(800,740) scale(0.7,-0.75) rotate(-14)"/>
            </g>

            <path stroke="#333b4b" stroke-width="4" fill="none" stroke-linecap="round"
                  d="M800 740 C 795 650, 805 560, 799 470 C 793 380, 805 330, 800 260"/>

            <g fill="none" stroke="#333b4b" stroke-width="2" opacity="0.9">
                <use xlink:href="#cluster" transform="translate(800,260) scale(1.9,1.9)"/>
                <use xlink:href="#cluster" transform="translate(800,260) scale(1.15,1.2) rotate(-10)"/>
                <use xlink:href="#cluster" transform="translate(800,260) scale(0.7,0.75) rotate(14)"/>
            </g>

            <g transform="translate(190,180)" fill="none" stroke="#333b4b" stroke-width="1.8">
                <path d="M18 -32 A 32 32 0 1 0 18 32 A 24 24 0 1 1 18 -32 Z"/>
            </g>

            <g transform="translate(1410,180)" fill="none" stroke="#333b4b" stroke-width="1.8">
                <circle r="30"/>
                <path d="M0 -44 L0 -58 M0 44 L0 58 M-44 0 L-58 0 M44 0 L58 0
                         M-31 -31 L-40 -40 M31 -31 L40 -40 M-31 31 L-40 40 M31 31 L40 40"/>
            </g>

            <g fill="#c7cedd" stroke="none" filter="url(#glowA)" opacity="0.9">
                <use xlink:href="#wolf" transform="translate(370,255) scale(-0.62,0.62) rotate(18)"/>
            </g>

            <g fill="#c7cedd" stroke="none" filter="url(#glowA)" opacity="0.9">
                <use xlink:href="#wolf" transform="translate(1230,255) scale(0.62,0.62) rotate(-18)"/>
            </g>
        </svg>
    </div>

    <main class="page">
        <header class="hero">
            <h1>Seed of Yggdrasil</h1>
            <p class="tagline">Draw a hero from the roots of the World Tree.</p>
        </header>

        <section class="card">
            <form class="summon-form" id="summonForm" novalidate>
                <label for="characterName">Name your character</label>
                <input
                    type="text"
                    id="characterName"
                    name="characterName"
                    placeholder="e.g. Ragnar"
                    autocomplete="off">
                <button type="submit" id="generateBtn">Reveal your character</button>
            </form>

            <div class="result" id="result" hidden>

                <div class="result-header">
                    <h2 id="charName"></h2>
                    <p id="charMeta"></p>
                </div>

                <dl class="ledger">
                    <div class="ledger-row">
                        <dt>Weapon</dt>
                        <dd id="charWeapon"></dd>
                    </div>
                    <div class="ledger-row">
                        <dt>Signature skill</dt>
                        <dd id="charSkill"></dd>
                    </div>
                </dl>

                <div class="attributes" id="attributes"></div>

                <div class="saga">
                    <p id="charStory"></p>
                </div>
            </div>
        </section>

        <footer class="credit">
            <p>Crafted by Franco Lescano<br>Source code on <a href="https://github.com/LescanoFranco123" target="_blank" rel="noopener">GitHub</a></p>
        </footer>
    </main>

    <script src="js/data.js"></script>
    <script src="js/generator.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
